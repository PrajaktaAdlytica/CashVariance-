<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" role="img" aria-labelledby="title-use-cases desc-use-cases"><title id="title-use-cases">A clearer handoff for every reviewer.</title><desc id="desc-use-cases">Three institutional reviewer pictograms share an evidence spine.</desc><style>:root{--paper:#F6F2E9;--soft:#E9DECA;--line:#BDB2A1;--accent:#754C26;--muted:#61594F;--warn:#8B570F;color:#29241E}text{font-family:Arial,sans-serif;fill:currentColor} .trace{stroke-dasharray:1000;animation:draw 4s ease-in-out infinite}.pulse{animation:pulse 4s ease-in-out infinite}.rise{animation:rise 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.route{animation:route 6s linear infinite}@keyframes draw{0%{stroke-dashoffset:200}60%,100%{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes route{to{stroke-dashoffset:-66}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}:root{--paper:#F6F2E9;--soft:#BACDC0;--accent:#315A42;color:#29241E;}</style><rect width="600" height="410" fill="#DCE4DD"/><g class="rise" style="animation-delay:0.0s"><circle cx="100" cy="125" r="28" fill="none" stroke="var(--accent)" stroke-width="2"/><path d="M52 240V220Q52 175 100 175Q148 175 148 220V240Z" fill="var(--paper)" stroke="var(--accent)" stroke-width="2"/></g><text x="55" y="280" font-size="15" >Treasury</text><g class="rise" style="animation-delay:0.25s"><circle cx="300" cy="125" r="28" fill="none" stroke="var(--accent)" stroke-width="2"/><path d="M252 240V220Q252 175 300 175Q348 175 348 220V240Z" fill="var(--paper)" stroke="var(--accent)" stroke-width="2"/></g><text x="255" y="280" font-size="15" >Controller</text><g class="rise" style="animation-delay:0.5s"><circle cx="500" cy="125" r="28" fill="none" stroke="var(--accent)" stroke-width="2"/><path d="M452 240V220Q452 175 500 175Q548 175 548 220V240Z" fill="var(--paper)" stroke="var(--accent)" stroke-width="2"/></g><text x="455" y="280" font-size="15" >Partner</text><path d="M100 315L500 315" stroke="var(--accent)" class="trace"/><text x="24" y="395" font-size="10" >ILLUSTRATIVE SYSTEM • CONCEPT PREVIEW</text></svg>