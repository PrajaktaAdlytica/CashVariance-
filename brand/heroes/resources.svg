<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" role="img" aria-labelledby="title-resources desc-resources"><title id="title-resources">A working library for a careful pilot.</title><desc id="desc-resources">Three indexed folders reveal their document edges.</desc><style>:root{--paper:#F6F2E9;--soft:#E9DECA;--line:#BDB2A1;--accent:#754C26;--muted:#61594F;--warn:#8B570F;color:#29241E}text{font-family:Arial,sans-serif;fill:currentColor} .trace{stroke-dasharray:1000;animation:draw 4s ease-in-out infinite}.pulse{animation:pulse 4s ease-in-out infinite}.rise{animation:rise 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.route{animation:route 6s linear infinite}@keyframes draw{0%{stroke-dashoffset:200}60%,100%{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes route{to{stroke-dashoffset:-66}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}:root{--paper:#F6F2E9;--soft:#D8C9B1;--accent:#754C26;color:#29241E;}</style><rect width="600" height="410" fill="#E9DECA"/><g class="rise" style="animation-delay:0.0s"><rect x="25" y="45" width="490" height="82" rx="12" fill="var(--paper)" stroke="var(--line)"/><text x="43" y="75" font-size="16" >Evaluation method</text><text x="43" y="102" font-size="12" fill="var(--muted)">CashVariance • Research-stage concept</text></g><g class="rise" style="animation-delay:0.2s"><rect x="53" y="139" width="490" height="82" rx="12" fill="var(--paper)" stroke="var(--line)"/><text x="71" y="169" font-size="16" >Data preparation</text><text x="71" y="196" font-size="12" fill="var(--muted)">CashVariance • Research-stage concept</text></g><g class="rise" style="animation-delay:0.4s"><rect x="81" y="233" width="490" height="82" rx="12" fill="var(--paper)" stroke="var(--line)"/><text x="99" y="263" font-size="16" >Research and sources</text><text x="99" y="290" font-size="12" fill="var(--muted)">CashVariance • Research-stage concept</text></g><text x="24" y="395" font-size="10" >ILLUSTRATIVE SYSTEM • CONCEPT PREVIEW</text></svg>