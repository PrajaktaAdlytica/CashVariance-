<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" role="img" aria-labelledby="title-cash-desk desc-cash-desk"><title id="title-cash-desk">Start the day with the difference in view.</title><desc id="desc-cash-desk">Aligned balance bars reveal an $8,000 unmatched segment, never auto-reconcile.</desc><style>:root{--paper:#F6F2E9;--soft:#E9DECA;--line:#BDB2A1;--accent:#754C26;--muted:#61594F;--warn:#8B570F;color:#29241E}text{font-family:Arial,sans-serif;fill:currentColor} .trace{stroke-dasharray:1000;animation:draw 4s ease-in-out infinite}.pulse{animation:pulse 4s ease-in-out infinite}.rise{animation:rise 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.route{animation:route 6s linear infinite}@keyframes draw{0%{stroke-dashoffset:200}60%,100%{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes route{to{stroke-dashoffset:-66}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}:root{--paper:#F6F2E9;--soft:#D8C9B1;--accent:#754C26;color:#29241E;}</style><rect width="600" height="410" fill="#E9DECA"/><text x="34" y="45" font-size="12" >DEMO / NQ-US / USD</text><text x="34" y="110" font-size="12" >BANK</text><text x="34" y="150" font-size="36" >$240,000</text><text x="335" y="110" font-size="12" >GL</text><text x="335" y="150" font-size="36" >$232,000</text><rect x="34" y="190" width="520" height="22" rx="0" fill="var(--soft)" /><rect x="34" y="190" width="502.7" height="22" rx="0" fill="var(--accent)" /><rect x="536.7" y="190" width="17.3" height="22" rx="0" fill="var(--warn)" class="pulse"/><path d="M300 80L300 168" stroke="var(--line)"/><text x="34" y="260" font-size="23" >$8,000 unexplained difference</text><text x="34" y="294" font-size="14" >TR-808 • Confirmation pending • Held</text><text x="34" y="336" font-size="13" >Stale: last 08:00 UTC / expected 09:00</text><text x="24" y="395" font-size="10" >DEMO — SYNTHETIC DATA</text></svg>