<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" role="img" aria-labelledby="title-about desc-about"><title id="title-about">A considered approach to the daily close.</title><desc id="desc-about">A slow cropped reveal of paper relief echoes the gap between records.</desc><style>:root{--paper:#F6F2E9;--soft:#E9DECA;--line:#BDB2A1;--accent:#754C26;--muted:#61594F;--warn:#8B570F;color:#29241E}text{font-family:Arial,sans-serif;fill:currentColor} .trace{stroke-dasharray:1000;animation:draw 4s ease-in-out infinite}.pulse{animation:pulse 4s ease-in-out infinite}.rise{animation:rise 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.route{animation:route 6s linear infinite}@keyframes draw{0%{stroke-dashoffset:200}60%,100%{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes route{to{stroke-dashoffset:-66}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}:root{--paper:#F6F2E9;--soft:#BACDC0;--accent:#315A42;color:#29241E;}image{animation:paper 10s ease-in-out infinite;transform-origin:center}@keyframes paper{0%,100%{transform:scale(1.02)}50%{transform:scale(1.04)}}@media(prefers-reduced-motion:reduce){image{animation:none}}</style><rect width="600" height="410" fill="#DCE4DD"/><image href="../backgrounds/sage-relief.webp" width="600" height="410" preserveAspectRatio="xMidYMid slice"/><text x="24" y="395" font-size="10" >ILLUSTRATIVE SYSTEM • CONCEPT PREVIEW</text></svg>