<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" role="img" aria-labelledby="title-sign-in desc-sign-in"><title id="title-sign-in">A preview you can inspect.</title><desc id="desc-sign-in">An open preview frame draws once; no login or connection simulation.</desc><style>:root{--paper:#F6F2E9;--soft:#E9DECA;--line:#BDB2A1;--accent:#754C26;--muted:#61594F;--warn:#8B570F;color:#29241E}text{font-family:Arial,sans-serif;fill:currentColor} .trace{stroke-dasharray:1000;animation:draw 4s ease-in-out infinite}.pulse{animation:pulse 4s ease-in-out infinite}.rise{animation:rise 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.route{animation:route 6s linear infinite}@keyframes draw{0%{stroke-dashoffset:200}60%,100%{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes route{to{stroke-dashoffset:-66}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}:root{--paper:#344C44;--soft:#456257;--accent:#E9DECA;color:#F6F2E9;}:root{--line:#758C7E;--muted:#DCE4DD}</style><rect width="600" height="410" fill="#293E38"/><rect x="100" y="40" width="400" height="290" rx="18" fill="var(--paper)" stroke="var(--accent)" stroke-width="2" class="trace"/><text x="153" y="110" font-size="16" >CONCEPT PREVIEW</text><text x="153" y="175" font-size="23" >No credentials needed.</text><text x="153" y="220" font-size="16" >Synthetic records only</text><text x="153" y="275" font-size="14" >Customer accounts unavailable</text><text x="24" y="395" font-size="10" >ILLUSTRATIVE SYSTEM • CONCEPT PREVIEW</text></svg>