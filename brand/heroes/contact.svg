<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" role="img" aria-labelledby="title-contact desc-contact"><title id="title-contact">Bring the right question to the right conversation.</title><desc id="desc-contact">Three inquiry routes converge at a stationary labeled contact point.</desc><style>:root{--paper:#F6F2E9;--soft:#E9DECA;--line:#BDB2A1;--accent:#754C26;--muted:#61594F;--warn:#8B570F;color:#29241E}text{font-family:Arial,sans-serif;fill:currentColor} .trace{stroke-dasharray:1000;animation:draw 4s ease-in-out infinite}.pulse{animation:pulse 4s ease-in-out infinite}.rise{animation:rise 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.route{animation:route 6s linear infinite}@keyframes draw{0%{stroke-dashoffset:200}60%,100%{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes route{to{stroke-dashoffset:-66}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}:root{--paper:#FFFDFA;--soft:#E9DECA;--accent:#754C26;color:#29241E;}</style><rect width="600" height="410" fill="#F6F2E9"/><rect x="20" y="40" width="210" height="76" rx="12" fill="var(--paper)" stroke="var(--line)"/><text x="38" y="70" font-size="16" >General inquiry</text><text x="38" y="97" font-size="12" fill="var(--muted)">Purpose-limited contact</text><path d="M230 78H320V190H390" stroke="var(--accent)" stroke-width="2" fill="none" class="trace"/><rect x="20" y="140" width="210" height="76" rx="12" fill="var(--paper)" stroke="var(--line)"/><text x="38" y="170" font-size="16" >Partner conversation</text><text x="38" y="197" font-size="12" fill="var(--muted)">Purpose-limited contact</text><path d="M230 178H320V190H390" stroke="var(--accent)" stroke-width="2" fill="none" class="trace"/><rect x="20" y="240" width="210" height="76" rx="12" fill="var(--paper)" stroke="var(--line)"/><text x="38" y="270" font-size="16" >Privacy request</text><text x="38" y="297" font-size="12" fill="var(--muted)">Purpose-limited contact</text><path d="M230 278H320V190H390" stroke="var(--accent)" stroke-width="2" fill="none" class="trace"/><rect x="390" y="148" width="185" height="84" rx="12" fill="var(--paper)" stroke="var(--line)"/><text x="408" y="178" font-size="16" >CashVariance</text><text x="408" y="205" font-size="12" fill="var(--muted)">No sensitive files</text><text x="24" y="395" font-size="10" >ILLUSTRATIVE SYSTEM • CONCEPT PREVIEW</text></svg>