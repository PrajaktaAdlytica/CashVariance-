<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" role="img" aria-labelledby="title-why-cash-exceptions desc-why-cash-exceptions"><title id="title-why-cash-exceptions">The numbers disagree for a reason.</title><desc id="desc-why-cash-exceptions">Source clocks reveal mismatched cutoffs while the stale warning persists.</desc><style>:root{--paper:#F6F2E9;--soft:#E9DECA;--line:#BDB2A1;--accent:#754C26;--muted:#61594F;--warn:#8B570F;color:#29241E}text{font-family:Arial,sans-serif;fill:currentColor} .trace{stroke-dasharray:1000;animation:draw 4s ease-in-out infinite}.pulse{animation:pulse 4s ease-in-out infinite}.rise{animation:rise 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.route{animation:route 6s linear infinite}@keyframes draw{0%{stroke-dashoffset:200}60%,100%{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes route{to{stroke-dashoffset:-66}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}:root{--paper:#F6F2E9;--soft:#D8C9B1;--accent:#754C26;color:#29241E;}</style><rect width="600" height="410" fill="#E9DECA"/><circle cx="95" cy="155" r="61" fill="var(--paper)" stroke="var(--line)"/><path d="M95 115V155L123 171" fill="none" stroke="var(--accent)" stroke-width="3" class="pulse"/><text x="45" y="60" font-size="14" >Bank source</text><text x="62" y="255" font-size="24" >08:00</text><text x="62" y="286" font-size="14" >Stale</text><circle cx="295" cy="155" r="61" fill="var(--paper)" stroke="var(--line)"/><path d="M295 115V155L323 171" fill="none" stroke="var(--accent)" stroke-width="3" class="pulse"/><text x="245" y="60" font-size="14" >Expected update</text><text x="262" y="255" font-size="24" >09:00</text><text x="262" y="286" font-size="14" >Missing</text><circle cx="495" cy="155" r="61" fill="var(--paper)" stroke="var(--line)"/><path d="M495 115V155L523 171" fill="none" stroke="var(--accent)" stroke-width="3" class="pulse"/><text x="445" y="60" font-size="14" >Review clock</text><text x="462" y="255" font-size="24" >10:00</text><text x="462" y="286" font-size="14" >Synthetic</text><text x="24" y="395" font-size="10" >DEMO — SYNTHETIC DATA</text></svg>