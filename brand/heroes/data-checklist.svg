<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" role="img" aria-labelledby="title-data-checklist desc-data-checklist"><title id="title-data-checklist">Prepare the evidence before the connection.</title><desc id="desc-data-checklist">Readiness rows draw in; no completed checkmarks are fabricated.</desc><style>:root{--paper:#F6F2E9;--soft:#E9DECA;--line:#BDB2A1;--accent:#754C26;--muted:#61594F;--warn:#8B570F;color:#29241E}text{font-family:Arial,sans-serif;fill:currentColor} .trace{stroke-dasharray:1000;animation:draw 4s ease-in-out infinite}.pulse{animation:pulse 4s ease-in-out infinite}.rise{animation:rise 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.route{animation:route 6s linear infinite}@keyframes draw{0%{stroke-dashoffset:200}60%,100%{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes route{to{stroke-dashoffset:-66}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}:root{--paper:#FFFDFA;--soft:#E9DECA;--accent:#754C26;color:#29241E;}</style><rect width="600" height="410" fill="#F6F2E9"/><path d="M58 90V310" stroke="var(--accent)" stroke-width="2" class="trace"/><rect x="88" y="42" width="465" height="80" rx="12" fill="var(--paper)" stroke="var(--line)"/><text x="106" y="72" font-size="16" >01 Coverage and cutoff</text><text x="106" y="99" font-size="12" fill="var(--muted)">Evidence remains inspectable</text><circle cx="58" cy="82" r="13" fill="var(--paper)" stroke="var(--accent)"/><rect x="88" y="145" width="465" height="80" rx="12" fill="var(--paper)" stroke="var(--line)"/><text x="106" y="175" font-size="16" >02 Mapping and currency</text><text x="106" y="202" font-size="12" fill="var(--muted)">Named reviewer and next action</text><circle cx="58" cy="185" r="13" fill="var(--paper)" stroke="var(--accent)"/><rect x="88" y="248" width="465" height="80" rx="12" fill="var(--paper)" stroke="var(--line)"/><text x="106" y="278" font-size="16" >03 Permissioned handling</text><text x="106" y="305" font-size="12" fill="var(--muted)">No bank or ERP writes</text><circle cx="58" cy="288" r="13" fill="var(--paper)" stroke="var(--accent)"/><text x="24" y="395" font-size="10" >ILLUSTRATIVE SYSTEM • CONCEPT PREVIEW</text></svg>