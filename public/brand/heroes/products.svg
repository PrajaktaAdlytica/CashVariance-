<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" role="img" aria-labelledby="title-products desc-products"><title id="title-products">Five focused jobs. One standard of evidence.</title><desc id="desc-products">Five labeled islands reveal their shared evidence spine.</desc><style>:root{--paper:#F6F2E9;--soft:#E9DECA;--line:#BDB2A1;--accent:#754C26;--muted:#61594F;--warn:#8B570F;color:#29241E}text{font-family:Arial,sans-serif;fill:currentColor} .trace{stroke-dasharray:1000;animation:draw 4s ease-in-out infinite}.pulse{animation:pulse 4s ease-in-out infinite}.rise{animation:rise 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.route{animation:route 6s linear infinite}@keyframes draw{0%{stroke-dashoffset:200}60%,100%{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes route{to{stroke-dashoffset:-66}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}:root{--paper:#FFFDFA;--soft:#E9DECA;--accent:#754C26;color:#29241E;}</style><rect width="600" height="410" fill="#F6F2E9"/><path d="M80 100H300V310M300 100H520M160 310H440" stroke="var(--accent)" fill="none" stroke-width="2" class="trace"/><rect x="20" y="40" width="160" height="85" rx="12" fill="var(--paper)" stroke="var(--line)"/><text x="38" y="70" font-size="16" >Cash Desk</text><text x="38" y="97" font-size="12" fill="var(--muted)">Proposed module</text><rect x="220" y="40" width="160" height="85" rx="12" fill="var(--paper)" stroke="var(--line)"/><text x="238" y="70" font-size="16" >Cash Review</text><text x="238" y="97" font-size="12" fill="var(--muted)">Proposed module</text><rect x="420" y="40" width="160" height="85" rx="12" fill="var(--paper)" stroke="var(--line)"/><text x="438" y="70" font-size="16" >Cash Proof</text><text x="438" y="97" font-size="12" fill="var(--muted)">Proposed module</text><rect x="80" y="250" width="160" height="85" rx="12" fill="var(--paper)" stroke="var(--line)"/><text x="98" y="280" font-size="16" >Cash Signal</text><text x="98" y="307" font-size="12" fill="var(--muted)">Proposed module</text><rect x="360" y="250" width="160" height="85" rx="12" fill="var(--paper)" stroke="var(--line)"/><text x="378" y="280" font-size="16" >Cash Report</text><text x="378" y="307" font-size="12" fill="var(--muted)">Proposed module</text><text x="235" y="205" font-size="16" >EVIDENCE</text><text x="24" y="395" font-size="10" >ILLUSTRATIVE SYSTEM • CONCEPT PREVIEW</text></svg>