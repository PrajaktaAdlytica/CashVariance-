<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" role="img" aria-labelledby="title-demo desc-demo"><title id="title-demo">Inspect the evidence. Keep the decision yours.</title><desc id="desc-demo">An annotation highlights TR-808; bank and GL values remain unchanged.</desc><style>:root{--paper:#F6F2E9;--soft:#E9DECA;--line:#BDB2A1;--accent:#754C26;--muted:#61594F;--warn:#8B570F;color:#29241E}text{font-family:Arial,sans-serif;fill:currentColor} .trace{stroke-dasharray:1000;animation:draw 4s ease-in-out infinite}.pulse{animation:pulse 4s ease-in-out infinite}.rise{animation:rise 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.route{animation:route 6s linear infinite}@keyframes draw{0%{stroke-dashoffset:200}60%,100%{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes route{to{stroke-dashoffset:-66}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}:root{--paper:#FFFDFA;--soft:#E9DECA;--accent:#754C26;color:#29241E;}</style><rect width="600" height="410" fill="#F6F2E9"/><rect x="22" y="40" width="230" height="280" rx="12" fill="var(--paper)" stroke="var(--line)"/><text x="40" y="70" font-size="16" >TR-808 / $8,000</text><text x="40" y="97" font-size="12" fill="var(--muted)">DEMO • SYNTHETIC DATA</text><rect x="278" y="75" width="298" height="100" rx="12" fill="var(--paper)" stroke="var(--line)"/><text x="296" y="105" font-size="16" >Bank source: ST-NQUS</text><text x="296" y="132" font-size="12" fill="var(--muted)">Receipt present • 08:00 UTC</text><rect x="278" y="205" width="298" height="100" rx="12" fill="var(--paper)" stroke="var(--line)"/><text x="296" y="235" font-size="16" >Counterparty: IC-NQ-808</text><text x="296" y="262" font-size="12" fill="var(--muted)">Confirmation missing • Held</text><path d="M252 132L278 132" class="trace" stroke="var(--accent)" stroke-width="2"/><path d="M252 255L278 255" cl