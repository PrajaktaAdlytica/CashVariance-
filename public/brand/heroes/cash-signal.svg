<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" role="img" aria-labelledby="title-cash-signal desc-cash-signal"><title id="title-cash-signal">Two reviewers. A visible release boundary.</title><desc id="desc-cash-signal">Two distinct reviewer nodes illuminate in sequence; execution stays unavailable.</desc><style>:root{--paper:#F6F2E9;--soft:#E9DECA;--line:#BDB2A1;--accent:#754C26;--muted:#61594F;--warn:#8B570F;color:#29241E}text{font-family:Arial,sans-serif;fill:currentColor} .trace{stroke-dasharray:1000;animation:draw 4s ease-in-out infinite}.pulse{animation:pulse 4s ease-in-out infinite}.rise{animation:rise 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.route{animation:route 6s linear infinite}@keyframes draw{0%{stroke-dashoffset:200}60%,100%{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes route{to{stroke-dashoffset:-66}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}:root{--paper:#344C44;--soft:#456257;--accent:#E9DECA;color:#F6F2E9;}:root{--line:#758C7E;--muted:#DCE4DD}</style><rect width="600" height="410" fill="#293E38"/><rect x="20" y="130" width="155" height="112" rx="12" fill="var(--paper)" stroke="var(--line)"/><text x="38" y="160" font-size="16" >Approved file</text><text x="38" y="187" font-size="12" fill="var(--muted)">PAY-DEMO-01</text><rect x="215" y="55" width="172" height="100" rx="12" fill="var(--paper)" stroke="var(--line)"/><text x="233" y="85" font-size="16" >Reviewer 01</text><text x="233" y="112" font-size="12" fill="var(--muted)">Evan • fictional</text><rect x="215" y="225" width="172" height="100" rx="12" fill="var(--paper)" stroke="var(--line)"/><text x="233" y="255" font-size="16" >Reviewer 02</text><text x="233" y="282" font-size="12" fill="var(--muted)">Lena • fictional</text><path d="M175 185H193V105H215M193 185V275H215M387 105H420V185H470M387 275H420V185" fill="none" stroke="var(--accent)" stroke-width="2" class="trace"/><rect x="470" y="150" width="100" height="72" rx="8" fill="var(--paper)" stroke="var(--line)"/><text x="485" y="180" font-size="16" >HELD</text><text x="485" y="204" font-size="12" >No send</text><text x="24" y="356" font-size="13" >Review acknowledgment never executes a payment.</text><text x="24" y="395" font-size="10" >DEMO — SYNTHETIC DATA</text></svg>