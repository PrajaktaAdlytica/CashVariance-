<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" role="img" aria-labelledby="title-pilot desc-pilot"><title id="title-pilot">One entity. Twenty daily closes.</title><desc id="desc-pilot">Twenty calendar cells progress to an unfilled evaluation gate, never a success counter.</desc><style>:root{--paper:#F6F2E9;--soft:#E9DECA;--line:#BDB2A1;--accent:#754C26;--muted:#61594F;--warn:#8B570F;color:#29241E}text{font-family:Arial,sans-serif;fill:currentColor} .trace{stroke-dasharray:1000;animation:draw 4s ease-in-out infinite}.pulse{animation:pulse 4s ease-in-out infinite}.rise{animation:rise 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.route{animation:route 6s linear infinite}@keyframes draw{0%{stroke-dashoffset:200}60%,100%{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes route{to{stroke-dashoffset:-66}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}:root{--paper:#F6F2E9;--soft:#D5B081;--accent:#754C26;color:#29241E;}</style><rect width="600" height="410" fill="#EAD5B6"/><text x="30" y="35" font-size="14" >20 HISTORICAL DAILY CLOSES</text><rect x="30" y="65" width="94" height="48" rx="4" fill="var(--paper)" stroke="var(--line)"/><text x="44" y="95" font-size="17" class="pulse" style="animation-delay:0.0s">01</text><rect x="138" y="65" width="94" height="48" rx="4" fill="var(--paper)" stroke="var(--line)"/><text x="152" y="95" font-size="17" class="pulse" style="animation-delay:0.12s">02</text><rect x="246" y="65" width="94" height="48" rx="4" fill="var(--paper)" stroke="var(--line)"/><text x="260" y="95" font-size="17" class="pulse" style="animation-delay:0.24s">03</text><rect x="354" y="65" width="94" height="48" rx="4" fill="var(--paper)" stroke="var(--line)"/><text x="368" y="95" font-size="17" class="pulse" style="animation-delay:0.36s">04</text><rect x="462" y="65" width="94" height="48" rx="4" fi