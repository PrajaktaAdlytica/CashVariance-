<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" role="img" aria-labelledby="title-pilot-scorecard desc-pilot-scorecard"><title id="title-pilot-scorecard">Measure reviewed outcomes, not demo polish.</title><desc id="desc-pilot-scorecard">Empty scorecard cells receive a quiet outline; no invented improvement fills them.</desc><style>:root{--paper:#F6F2E9;--soft:#E9DECA;--line:#BDB2A1;--accent:#754C26;--muted:#61594F;--warn:#8B570F;color:#29241E}text{font-family:Arial,sans-serif;fill:currentColor} .trace{stroke-dasharray:1000;animation:draw 4s ease-in-out infinite}.pulse{animation:pulse 4s ease-in-out infinite}.rise{animation:rise 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.route{animation:route 6s linear infinite}@keyframes draw{0%{stroke-dashoffset:200}60%,100%{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes route{to{stroke-dashoffset:-66}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}:root{--paper:#F6F2E9;--soft:#BACDC0;--accent:#315A42;color:#29241E;}</style><rect width="600" height="410" fill="#DCE4DD"/><text x="30" y="48" font-size="16" >PILOT SCORECARD</text><text x="30" y="95" font-size="17" >Accepted closures</text><rect x="350" y="70" width="220" height="40" rx="4" fill="var(--paper)" stroke="var(--line)" class="pulse"/><text x="367" y="95" font-size="14" >To be measured</text><text x="30" y="160" font-size="17" >Manual review time</text><rect x="350" y="135" width="220" height="40" rx="4" fill="var(--paper)" stroke="var(--line)" class="pulse"/><text x="367" y="160" font-size="14" >To be measured</text><text x="30" y="225" font-size="17" >False closures / omissions</text><rect x="350" y="200" width="220" height="40" rx="4" fill="var(--paper)" stroke="var(--line)" class="pulse"/><text x="367" y="225" font-size="14" >To be measured</text><text x="30" y="290" font-size="17" >Stale-source incidents</text><rect x="350" y="265" width="220" height="40" rx="4" fill="var(--paper)" stroke="var(--line)" class="pulse"/><text x="367" y="290" font-size="14" >To be measured</text><text x="24" y="395" font-size="10" >ILLUSTRATIVE SYSTEM • CONCEPT PREVIEW</text></svg>