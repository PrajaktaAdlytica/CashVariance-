<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" role="img" aria-labelledby="title-404 desc-404"><title id="title-404">This path is still open.</title><desc id="desc-404">A broken route reveals its gap and offers three labeled recovery paths.</desc><style>:root{--paper:#F6F2E9;--soft:#E9DECA;--line:#BDB2A1;--accent:#754C26;--muted:#61594F;--warn:#8B570F;color:#29241E}text{font-family:Arial,sans-serif;fill:currentColor} .trace{stroke-dasharray:1000;animation:draw 4s ease-in-out infinite}.pulse{animation:pulse 4s ease-in-out infinite}.rise{animation:rise 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.route{animation:route 6s linear infinite}@keyframes draw{0%{stroke-dashoffset:200}60%,100%{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes route{to{stroke-dashoffset:-66}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}:root{--paper:#F6F2E9;--soft:#D5B081;--accent:#754C26;color:#29241E;}</style><rect width="600" height="410" fill="#EAD5B6"/><path d="M25 190H220M320 190H570M430 190V85H540M430 190V300H540" fill="none" stroke="var(--accent)" stroke-width="3" class="trace"/><text x="237" y="180" font-size="36" >404</text><text x="468" y="70" font-size="15" >Home</text><text x="468" y="175" font-size="15" >Products</text><text x="468" y="330" font-size="15" >Demo</text><text x="24" y="395" font-size="10" >ILLUSTRATIVE SYSTEM • CONCEPT PREVIEW</text></svg>